name: AMALGAMA checks
on:
  push:
    branches:
      - feature/amalgama-linux-guardian-ci
  pull_request:
    paths:
      - 'amalgama/**'
      - 'tests/test_amalgama*'
      - 'requirements-amalgama.txt'
      - '.github/workflows/amalgama-checks.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<9" -r requirements-amalgama.txt
      - name: Run AMALGAMA tests
        run: python -m pytest -q tests/test_amalgama_cli.py tests/test_amalgama_watch.py tests/test_amalgama_guardian.py tests/test_amalgama_registry_recovery.py tests/test_amalgama_signed_manifest.py
