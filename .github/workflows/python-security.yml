name: Python source security scan

on:
  push:
    paths:
      - "app/**"
      - ".github/workflows/python-security.yml"
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/python-security.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bandit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Bandit
        run: python -m pip install bandit
      - name: Scan application source for medium/high findings
        run: bandit -q -r app -ll -ii
